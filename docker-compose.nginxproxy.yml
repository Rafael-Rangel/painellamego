# Integração com nginx-proxy + acme-companion já em execução (ex.: /opt/jada).
# Não altera o outro projeto: só anexa o container web à rede externa `jada_webproxy`.
#
#   docker compose -f docker-compose.yml -f docker-compose.nginxproxy.yml up -d --build

services:
  caddy:
    profiles:
      - edge-caddy

  web:
    networks:
      - edge
      - webproxy
    environment:
      VIRTUAL_HOST: painellamego.com.br,www.painellamego.com.br
      LETSENCRYPT_HOST: painellamego.com.br,www.painellamego.com.br
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@painellamego.com.br}
      VIRTUAL_PORT: "80"
      # Multipart (nota / IA): limite baixo do nginx-proxy causa 413 em PDFs ~4–5 MB.
      CLIENT_MAX_BODY_SIZE: 25m

networks:
  webproxy:
    external: true
    name: jada_webproxy
